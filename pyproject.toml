[project]
name = "pucpr-backend-fastapi"
version = "0.1.0"
description = "FastAPI implementation of the PUCPR auth server."
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "email-validator==2.3.0",
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.0",
    "PyJWT==2.12.1",
    "sqlalchemy==2.0.49",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
